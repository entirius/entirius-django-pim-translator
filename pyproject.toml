[project]
name = "entirius-django-pim-translator"
version = "2.0.0"
description = "PIM AI translation bridge — communicates with the AI toolbox via HTTP"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=5.0",
    "celery>=5.4",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.0",
    "drf-spectacular>=0.27",
    "pydantic>=2.0",
    "entirius-django-pim>=3.0.0",
    "entirius-django-utils>=2.0.0",
    "entirius-django-utils-translator>=2.0.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "respx>=0.21", "dj-database-url", "psycopg[binary]"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-pim-translator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_pim_translator"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S106", "F841"]
# Legacy migrated 1:1 — pre-existing lint debt, tracked outside this repo; do not grow these lists.
"src/django_pim_translator/services/*" = ["B904"]
"src/django_pim_translator/tasks/*" = ["B904"]

[tool.ruff.lint.isort]
known-first-party = ["django_pim_translator"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
